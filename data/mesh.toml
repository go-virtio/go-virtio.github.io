# go-virtio stack visualisation — read by layouts/partials/mesh.html.
#
# Three rows :
#   Top    : the seven spec-level device-class drivers.
#   Middle : the common waist — single Transport interface.
#   Bottom : host backplane (UEFI, MMIO, virtio-mmio, TamaGo test harness).
#
# Spheres flow common → driver → host, encoding "one Transport,
# every backplane".

# ---------- Containers (back layer rectangles) ----------

# Top band : drivers.
[[containers]]
kind  = "dc"
x     = 60
y     = 60
w     = 1080
h     = 130
label = "SPEC-LEVEL DRIVERS"
lx    = 130
ly    = 50

# Middle band : common.
[[containers]]
kind  = "rack"
x     = 360
y     = 240
w     = 480
h     = 110
label = "go-virtio/common — Transport interface"
lx    = 430
ly    = 232

# Bottom band : host backplane.
[[containers]]
kind  = "dc"
x     = 60
y     = 400
w     = 1080
h     = 120
label = "HOST BACKPLANE"
lx    = 130
ly    = 392

