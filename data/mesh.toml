# ---------- Paths (moving spheres) ----------
#
# Each sphere is one (driver, host) pairing being driven through
# common. Staggered timing so the eye sees continuous flow in both
# directions through the waist.

[[paths]]
d = "M 220 130 L 600 295 L 180 460"
dur = "5s"
r = 5
fill = "var(--accent-3)"
[[paths]]
d = "M 220 130 L 600 295 L 420 460"
