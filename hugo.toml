baseURL = 'https://go-virtio.github.io/'
locale  = 'en-us'
title   = 'go-virtio'
# No theme — layouts live in ./layouts

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

[params]
  description = "go-virtio is a pure-Go, transport-agnostic family of virtio device-class drivers. One reusable codebase across UEFI, bare-metal MMIO, virtio-mmio, and anything else that can satisfy the Transport interface."
  brand       = "go-virtio"
  github      = "go-virtio"
  heroAccent  = "go-virtio"
  heroTagline = "Pure-Go virtio drivers. One Transport interface. Every backplane."

  heroIntro = [
    "<strong>go-virtio</strong> is a small family of Go modules implementing <a href=\"https://docs.oasis-open.org/virtio/virtio/v1.1/virtio-v1.1.html\">virtio</a> device-class drivers in pure Go &mdash; no cgo, no kernel &mdash; and routing every transport-level operation through a narrow interface. The same driver code works under UEFI, bare-metal MMIO, virtio-mmio, and any backplane that can satisfy the contract.",
    "Extracted from the <a href=\"https://github.com/cloud-boot\">cloud-boot</a> TamaGo + UEFI loader, but designed from day one to run anywhere virtio runs. The point is to replace fragmented in-tree virtio code across Go projects with one reusable, well-tested, transport-pluggable set of drivers."
  ]

  meshCaption = "<strong>One Transport interface, many drivers.</strong> <code>go-virtio/common</code> sits between the spec-level drivers (net, blk, &hellip;) and the host backplane (UEFI, bare-metal MMIO, virtio-mmio). Swap the backplane, keep the driver."

